<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dogly Train</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FAFAFA; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 48px 32px; max-width: 420px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .logo { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; color: #1A1A2E; margin-bottom: 8px; }
    .tagline { font-size: 16px; color: #6B7280; margin-bottom: 32px; line-height: 1.5; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .links a { display: block; padding: 14px 24px; background: #F5A623; color: #fff; text-decoration: none; border-radius: 8px; font-size: 15px; font-weight: 600; }
    .links a.secondary { background: #fff; color: #F5A623; border: 2px solid #F5A623; }
    .footer { margin-top: 32px; font-size: 13px; color: #6B7280; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#128054;</div>
    <h1>Dogly Train</h1>
    <p class="tagline">Connect with the best dog trainers near you.</p>
    <div class="links">
      <a href="dogly-train://">Open App</a>
      <a href="/privacy-policy" class="secondary">Privacy Policy</a>
      <a href="/terms-of-service" class="secondary">Terms of Service</a>
      <a href="/delete-account" class="secondary">Delete Account</a>
    </div>
    <p class="footer">Dogly Train &copy; 2026</p>
  </div>
</body>
</html>
