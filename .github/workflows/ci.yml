name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: Type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install client deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Install functions deps BEFORE client typecheck — even though
      # tsconfig.json excludes `functions/`, this keeps both contexts ready
      # for parallel use (e.g. future jobs that lint cross-folder imports).
      - name: Install functions deps
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Typecheck client
        run: npx tsc --noEmit

      - name: Build functions
        working-directory: functions
        run: npm run build

  rules-tests:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Firestore emulator is a Java JAR — needs a JRE.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install client deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Pin firebase-tools to the same version used locally to avoid surprise
      # behaviour changes between minor releases of the emulator wrapper.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.16.0

      # Run jest directly; we'll start the emulator separately so we have
      # control over its logs and can `cat firestore-debug.log` if tests fail.
      # The github-actions reporter (configured in jest.config.js) emits
      # ::error:: annotations for individual test failures.
      - name: Run Firestore rules tests
        env:
          CI: true
        run: npx firebase emulators:exec --only firestore --project=dogly-train-rules-test "npx jest --config jest.config.js --runInBand --verbose"

      - name: Dump emulator log on failure
        if: failure()
        run: |
          echo "=== firestore-debug.log ==="
          cat firestore-debug.log || echo "(no debug log)"
          echo "=== firebase-debug.log ==="
          cat firebase-debug.log || echo "(no debug log)"
